name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  launcher:
    # race_day.sh runs on macOS under /bin/bash 3.2, and that shell is what lost
    # the 2026 Spanish GP: an empty array under `set -u` killed the engine
    # launch. Linux's bash 5 accepts the same line, so this test only means
    # anything on a macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --python 3.12

      - name: Launcher dry run under /bin/bash
        run: uv run pytest -q tests/test_race_day.py
