[project]
name = "pitwall"
version = "0.1.0"
description = "A live Formula 1 race strategy engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastf1>=3.4",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[project.scripts]
pitwall = "pitwall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.hatch.build.targets.wheel.force-include]
"src/pitwall/dashboard/static" = "pitwall/dashboard/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The dashboard tests import fastapi only after importorskip, so those imports
# cannot sit at the top of the file.
"tests/test_dashboard.py" = ["E402", "I001"]
